name: Build and Release

on:
  push:
    branches: [main, 'feature/*']
    paths-ignore:
      # Documentation and repository metadata do not change the shipped app.
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'
      - '.gitignore'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/tests.yml'

      # Test-only changes are verified by tests.yml but do not need a release.
      - 'AutoPiPTests/**'
      - 'AutoPiPUITests/**'
      - 'tests/**'

      # Generated by this workflow; ignoring it prevents a release loop.
      - 'appcast.xml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CREATE_DMG_VERSION: '1.3.0'
  SPARKLE_VERSION: '2.9.3'

jobs:
  check:
    name: Check release trigger
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.release-trigger.outputs.should-build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: release-trigger
        env:
          ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$ACTOR" in
            "github-actions[bot]"|"autopip-ci-bot"|"autopip-ci-bot[bot]")
              echo "should-build=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping release triggered by $ACTOR"
              exit 0
              ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_NAME" != "main" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$HEAD_SHA" -- semver.txt; then
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping main build because semver.txt did not change"
          else
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.should-build == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      # Tags and the canonical appcast are shared across all release branches.
      group: build-and-release
      cancel-in-progress: false

    steps:
      - name: Generate GitHub App token
        id: app-token
        if: vars.CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Load canonical appcast
        if: github.ref_name != 'main'
        run: |
          git fetch origin main
          git show origin/main:appcast.xml > appcast.xml

      - name: Prepare release metadata
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(head -1 semver.txt | tr -d '[:space:]')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semver in semver.txt: '$VERSION'"
            exit 1
          fi

          awk '
            /^---$/ { found = 1; next }
            /^## [0-9]+\.[0-9]+\.[0-9]+$/ { exit }
            found { print }
          ' semver.txt | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/changelog.txt"

          if [ "$REF_NAME" = "main" ]; then
            TAG="v${VERSION}"
            CHANNEL="stable"
            PRERELEASE=false
          else
            TAG=$(git tag --points-at "$GITHUB_SHA" \
              | grep -E "^v${VERSION}-beta[0-9]+$" \
              | sort -V \
              | tail -1 || true)
            if [ -z "$TAG" ]; then
              LATEST=$(git tag -l "v${VERSION}-beta*" \
                | sed "s/v${VERSION}-beta//" \
                | grep -E '^[0-9]+$' \
                | sort -n \
                | tail -1 || true)
              BETA_NUMBER=$(( ${LATEST:-0} + 1 ))
              TAG="v${VERSION}-beta${BETA_NUMBER}"
            else
              echo "Reusing $TAG for a retry of $GITHUB_SHA"
            fi
            CHANNEL="beta"
            PRERELEASE=true
          fi

          # Keep Sparkle's internal version increasing across beta and stable runs.
          BUILD=$(( RUN_NUMBER + 10 ))

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already points to $TAG_SHA; refusing to move it"
              exit 1
            fi
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

          echo "### ${CHANNEL} release - ${TAG} (${BUILD})" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/changelog.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Set project version
        env:
          BUILD: ${{ steps.release.outputs.build }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = ${VERSION};/" \
            AutoPiP.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = ${BUILD};/" \
            AutoPiP.xcodeproj/project.pbxproj
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" \
            "AutoPiP Extension/Resources/manifest.json"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project AutoPiP.xcodeproj -scheme AutoPiP

      - name: Run tests
        run: |
          node --test tests/*.test.js
          xcodebuild test \
            -project AutoPiP.xcodeproj \
            -scheme AutoPiP \
            -destination 'platform=macOS' \
            -only-testing:AutoPiPTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Code-signing secrets are not configured"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project AutoPiP.xcodeproj \
            -scheme AutoPiP \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AutoPiP.xcarchive"

      - name: Create DMG
        run: |
          APP_PATH="$RUNNER_TEMP/AutoPiP.xcarchive/Products/Applications/AutoPiP.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::AutoPiP.app was not produced by the archive"
            exit 1
          fi

          CREATE_DMG_ARCHIVE="$RUNNER_TEMP/create-dmg.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/create-dmg/create-dmg/archive/refs/tags/v${CREATE_DMG_VERSION}.tar.gz" \
            --output "$CREATE_DMG_ARCHIVE"
          tar -xzf "$CREATE_DMG_ARCHIVE" -C "$RUNNER_TEMP"

          "$RUNNER_TEMP/create-dmg-${CREATE_DMG_VERSION}/create-dmg" \
            --volname "AutoPiP" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AutoPiP.app" 175 190 \
            --app-drop-link 425 190 \
            "$RUNNER_TEMP/AutoPiP.dmg" \
            "$APP_PATH"

      - name: Sign DMG and update appcast
        env:
          BUILD: ${{ steps.release.outputs.build }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not configured"
            exit 1
          fi

          DMG_PATH="$RUNNER_TEMP/AutoPiP.dmg"
          SPARKLE_ARCHIVE="$RUNNER_TEMP/sparkle.tar.xz"
          curl --fail --location --silent --show-error \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --output "$SPARKLE_ARCHIVE"
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xJf "$SPARKLE_ARCHIVE" -C "$RUNNER_TEMP/sparkle"

          KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIGN_OUTPUT=$("$RUNNER_TEMP/sparkle/bin/sign_update" "$DMG_PATH" --ed-key-file "$KEY_FILE" 2>&1) || {
            rm -f "$KEY_FILE"
            echo "::error::Sparkle signing failed"
            echo "$SIGN_OUTPUT"
            exit 1
          }
          rm -f "$KEY_FILE"

          SIGNATURE=$(printf '%s\n' "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$SIGNATURE" ]; then
            echo "::error::Sparkle did not return an EdDSA signature"
            exit 1
          fi

          python3 scripts/update_appcast.py \
            --appcast appcast.xml \
            --changelog "$RUNNER_TEMP/changelog.txt" \
            --version "$VERSION" \
            --tag "$TAG" \
            --build "$BUILD" \
            --channel "$CHANNEL" \
            --signature "$SIGNATURE" \
            --length "$(stat -f%z "$DMG_PATH")"
          xmllint --noout appcast.xml
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoPiP-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/AutoPiP.dmg
          if-no-files-found: error

      - name: Prepare release notes
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          NOTES="$RUNNER_TEMP/release_notes.md"
          if [ "$PRERELEASE" = "true" ]; then
            {
              echo "> [!WARNING]"
              echo "> **This is a beta release.** It may be unstable or incomplete."
              echo
            } > "$NOTES"
          else
            : > "$NOTES"
          fi

          if [ -s "$RUNNER_TEMP/changelog.txt" ]; then
            {
              echo "## Changelog"
              echo
              cat "$RUNNER_TEMP/changelog.txt"
              echo
            } >> "$NOTES"
          fi

          cat >> "$NOTES" <<'INSTALLATION'
          ## Installation

          This release is not notarized by Apple. After downloading `AutoPiP.dmg`,
          macOS may require **System Settings > Privacy & Security > Open Anyway**
          for both the disk image and the app. Then copy AutoPiP to Applications,
          open it, and enable the extension in Safari Settings.
          INSTALLATION

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          files: ${{ runner.temp }}/AutoPiP.dmg
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/release_notes.md
          fail_on_unmatched_files: true
          overwrite_files: true
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Publish canonical appcast
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin main
          APPCAST_WORKTREE="$RUNNER_TEMP/appcast-main"
          git worktree add --detach "$APPCAST_WORKTREE" origin/main
          git -C "$APPCAST_WORKTREE" config user.name "github-actions[bot]"
          git -C "$APPCAST_WORKTREE" config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/appcast.xml" "$APPCAST_WORKTREE/appcast.xml"
          git -C "$APPCAST_WORKTREE" add appcast.xml

          if [ "$CHANNEL" = "stable" ]; then
            python3 scripts/update_homebrew_cask.py \
              --cask "$APPCAST_WORKTREE/Casks/autopip.rb" \
              --version "$VERSION" \
              --archive "$RUNNER_TEMP/AutoPiP.dmg"
            git -C "$APPCAST_WORKTREE" add Casks/autopip.rb
          fi

          if git -C "$APPCAST_WORKTREE" diff --cached --quiet; then
            echo "Release metadata is already current"
            exit 0
          fi

          git -C "$APPCAST_WORKTREE" commit -m "chore: update release metadata for ${TAG}"
          git -C "$APPCAST_WORKTREE" push origin HEAD:main

      - name: Cleanup keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/sparkle_ed_key"
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi